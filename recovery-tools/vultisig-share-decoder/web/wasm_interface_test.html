<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASM Interface Test - EdDSA Key Extraction</title>
    <style>
        body { font-family: monospace; margin: 20px; }
        .test-section { border: 1px solid #ccc; margin: 10px 0; padding: 10px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        button { margin: 5px; padding: 10px; }
    </style>
</head>
<body>
    <h1>WASM Interface Test - EdDSA Key Extraction</h1>
    <p>This test explores different approaches to extract EdDSA private keys from DKLS keyshares.</p>
    
    <div class="test-section">
        <h3>1. Current WASM Interface Analysis</h3>
        <button onclick="analyzeWASMInterface()">Analyze WASM Classes & Methods</button>
        <div id="wasmAnalysis"></div>
    </div>
    
    <div class="test-section">
        <h3>2. Keyshare Data Structure Analysis</h3>
        <button onclick="analyzeKeyshareStructure()">Analyze Keyshare Methods</button>
        <div id="keyshareAnalysis"></div>
    </div>
    
    <div class="test-section">
        <h3>3. Key Extraction Experiments</h3>
        <button onclick="testKeyExtractionMethods()">Test Key Extraction Methods</button>
        <div id="keyExtractionTests"></div>
    </div>
    
    <div class="test-section">
        <h3>4. Session Finish Analysis</h3>
        <button onclick="analyzeSessionFinishResult()">Analyze session.finish() Result</button>
        <div id="sessionFinishAnalysis"></div>
    </div>
    
    <div class="test-section">
        <h3>5. Multi-Session Experiment</h3>
        <button onclick="testMultipleSessionApproach()">Test Multiple Session Approach</button>
        <div id="multiSessionTest"></div>
    </div>

    <script type="module">
        import init, { 
            Keyshare, 
            KeyExportSession, 
            KeygenSession,
            SignSession,
            FinalSession
        } from './vs_wasm.js';

        // Global variables for tests
        let wasmModule = null;
        let testKeyshares = null;
        let testPartyIds = null;

        // Initialize WASM module
        async function initWASM() {
            try {
                wasmModule = await init();
                window.vsWasmModule = { 
                    Keyshare, 
                    KeyExportSession, 
                    KeygenSession,
                    SignSession,
                    FinalSession
                };
                log("✅ WASM module initialized successfully", "success");
                return true;
            } catch (error) {
                log(`❌ WASM initialization failed: ${error.message}`, "error");
                return false;
            }
        }

        function log(message, type = "info") {
            console.log(message);
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = `<pre>${message}</pre>`;
            return div;
        }

        // 1. Analyze WASM Interface
        window.analyzeWASMInterface = async function() {
            const output = document.getElementById('wasmAnalysis');
            output.innerHTML = '';
            
            if (!wasmModule) {
                const success = await initWASM();
                if (!success) return;
            }

            output.appendChild(log("=== WASM Interface Analysis ==="));
            
            // Analyze KeyExportSession
            output.appendChild(log("\\n📊 KeyExportSession Methods:"));
            const keyExportMethods = Object.getOwnPropertyNames(KeyExportSession).concat(
                Object.getOwnPropertyNames(KeyExportSession.prototype)
            );
            output.appendChild(log(`Static methods: ${keyExportMethods.filter(m => typeof KeyExportSession[m] === 'function').join(', ')}`));
            output.appendChild(log(`Instance methods: ${keyExportMethods.filter(m => m !== 'constructor' && typeof KeyExportSession.prototype[m] === 'function').join(', ')}`));

            // Analyze Keyshare
            output.appendChild(log("\\n📊 Keyshare Methods:"));
            const keyshareProto = Object.getOwnPropertyNames(Keyshare.prototype);
            output.appendChild(log(`Instance methods: ${keyshareProto.filter(m => m !== 'constructor').join(', ')}`));

            // Check for other session types
            output.appendChild(log("\\n📊 Other Session Types Available:"));
            output.appendChild(log(`KeygenSession: ${typeof KeygenSession !== 'undefined' ? '✅' : '❌'}`));
            output.appendChild(log(`SignSession: ${typeof SignSession !== 'undefined' ? '✅' : '❌'}`));
            output.appendChild(log(`FinalSession: ${typeof FinalSession !== 'undefined' ? '✅' : '❌'}`));
        };

        // 2. Analyze Keyshare Structure
        window.analyzeKeyshareStructure = async function() {
            const output = document.getElementById('keyshareAnalysis');
            output.innerHTML = '';
            
            if (!wasmModule) {
                const success = await initWASM();
                if (!success) return;
            }

            output.appendChild(log("=== Keyshare Structure Analysis ==="));
            output.appendChild(log("\\n⚠️  This test requires actual DKLS keyshare data."));
            output.appendChild(log("Please provide test keyshares to analyze their structure."));
            
            // Document what we know about keyshare methods
            output.appendChild(log("\\n📋 Known Keyshare Methods:"));
            output.appendChild(log("• publicKey() -> Uint8Array - returns public key"));
            output.appendChild(log("• keyId() -> ? - returns key identifier"));
            output.appendChild(log("• rootChainCode() -> Uint8Array - returns chain code"));
            output.appendChild(log("• toBytes() / fromBytes() - serialization"));
            
            output.appendChild(log("\\n❓ Questions to investigate:"));
            output.appendChild(log("1. Does publicKey() return ECDSA or EdDSA key?"));
            output.appendChild(log("2. Are there separate methods for different key types?"));
            output.appendChild(log("3. Does the keyshare contain both ECDSA and EdDSA data?"));
        };

        // 3. Test Key Extraction Methods
        window.testKeyExtractionMethods = async function() {
            const output = document.getElementById('keyExtractionTests');
            output.innerHTML = '';
            
            if (!wasmModule) {
                const success = await initWASM();
                if (!success) return;
            }

            output.appendChild(log("=== Key Extraction Method Tests ==="));
            output.appendChild(log("\\n⚠️  This test requires actual DKLS keyshare data to be meaningful."));
            
            // Test different theoretical approaches
            output.appendChild(log("\\n🧪 Theoretical Approaches to Test:"));
            output.appendChild(log("\\n1. Check KeyExportSession.new() parameters:"));
            output.appendChild(log("   - Current: KeyExportSession.new(share, partyIds)"));
            output.appendChild(log("   - Question: Are there additional parameters for key type?"));
            
            output.appendChild(log("\\n2. Check KeyExportSession static methods:"));
            try {
                const staticMethods = Object.getOwnPropertyNames(KeyExportSession).filter(name => 
                    typeof KeyExportSession[name] === 'function' && name !== 'length' && name !== 'name'
                );
                output.appendChild(log(`   Available static methods: ${staticMethods.join(', ')}`));
            } catch (e) {
                output.appendChild(log(`   Error analyzing static methods: ${e.message}`, "error"));
            }

            output.appendChild(log("\\n3. Check session.finish() variations:"));
            output.appendChild(log("   - Current: session.finish() -> single Uint8Array"));
            output.appendChild(log("   - Question: Are there parameters for finish()?"));
            
            output.appendChild(log("\\n4. Alternative session types:"));
            output.appendChild(log("   - Test KeygenSession for multi-key extraction"));
            output.appendChild(log("   - Test if different session types handle EdDSA"));
        };

        // 4. Analyze Session Finish Result
        window.analyzeSessionFinishResult = async function() {
            const output = document.getElementById('sessionFinishAnalysis');
            output.innerHTML = '';
            
            output.appendChild(log("=== Session Finish Result Analysis ==="));
            output.appendChild(log("\\n⚠️  This analysis requires an active KeyExportSession with real data."));
            
            output.appendChild(log("\\n🔍 Analysis Plan:"));
            output.appendChild(log("1. Examine the length of the returned Uint8Array"));
            output.appendChild(log("2. Check if it's exactly 32 bytes (standard private key) or longer"));
            output.appendChild(log("3. Look for patterns that might indicate multiple keys"));
            output.appendChild(log("4. Compare with known ECDSA private key format"));
            
            output.appendChild(log("\\n📏 Expected Key Sizes:"));
            output.appendChild(log("• ECDSA private key: 32 bytes"));
            output.appendChild(log("• EdDSA private key: 32 bytes"));
            output.appendChild(log("• Combined: 64+ bytes (if both included)"));
            
            output.appendChild(log("\\n❓ Key Questions:"));
            output.appendChild(log("• If result is 32 bytes -> probably single key type"));
            output.appendChild(log("• If result is 64+ bytes -> might contain both keys"));
            output.appendChild(log("• Need to test with actual DKLS data"));
        };

        // 5. Test Multiple Session Approach
        window.testMultipleSessionApproach = async function() {
            const output = document.getElementById('multiSessionTest');
            output.innerHTML = '';
            
            output.appendChild(log("=== Multiple Session Approach Test ==="));
            output.appendChild(log("\\n💡 Theory: Create separate sessions for ECDSA and EdDSA extraction"));
            
            output.appendChild(log("\\n🧪 Approach 1: Same keyshares, different sessions"));
            output.appendChild(log("```javascript"));
            output.appendChild(log("// Session 1 - ECDSA extraction"));
            output.appendChild(log("const ecdsaSession = KeyExportSession.new(keyshares[0], partyIds);"));
            output.appendChild(log("// ... process keyshares ..."));
            output.appendChild(log("const ecdsaKey = ecdsaSession.finish();"));
            output.appendChild(log(""));
            output.appendChild(log("// Session 2 - EdDSA extraction (same keyshares?)"));
            output.appendChild(log("const eddsaSession = KeyExportSession.new(keyshares[0], partyIds);"));
            output.appendChild(log("// ... same process? ..."));
            output.appendChild(log("const eddsaKey = eddsaSession.finish();"));
            output.appendChild(log("```"));
            
            output.appendChild(log("\\n🧪 Approach 2: Different session parameters"));
            output.appendChild(log("• Check if KeyExportSession.new() accepts key type parameter"));
            output.appendChild(log("• Look for alternative static constructors"));
            
            output.appendChild(log("\\n🧪 Approach 3: Use different WASM classes"));
            output.appendChild(log("• Test KeygenSession for multi-key extraction"));
            output.appendChild(log("• Test SignSession variations"));
            
            output.appendChild(log("\\n⚠️  Need actual DKLS keyshare data to test these approaches"));
        };

        // Initialize on page load
        window.addEventListener('load', initWASM);
    </script>
</body>
</html>
